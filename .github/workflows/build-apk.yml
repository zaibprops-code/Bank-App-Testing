name: Build Android APK

# Builds an installable **release** APK in GitHub's cloud. A release APK
# bundles the JS inside the file, so it runs standalone on the phone with no
# computer / Metro server. Signed with the default debug keystore so it
# installs directly. No Expo account or secrets required.
# Run it from the "Actions" tab (Run workflow), or it runs automatically on push.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up Java (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project (expo prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: Raise Gradle memory (prevents "Java heap space" OOM)
        run: |
          echo "" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1536m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8" >> android/gradle.properties
          echo "org.gradle.workers.max=2" >> android/gradle.properties
          echo "android.enableJetifier=false" >> android/gradle.properties

      - name: Build release APK (standalone, JS bundled inside)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk bank-app-testing.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bank-app-testing-apk
          path: bank-app-testing.apk
          if-no-files-found: error

      - name: Publish APK to a GitHub Release (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest APK build
          body: |
            Standalone release APK for the Bank App demo (runs offline, no computer needed).
            Download **bank-app-testing.apk** below and install it on your Android phone.
          files: bank-app-testing.apk
          make_latest: true
